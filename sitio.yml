filosofia:
  titulo: Nuestra filosofía
  foto: /img/filosofia.webp
  texto: >-
    En la cosmovisión andina, Kawsay es la energía vital que nos anima y que conecta todo lo que existe:
    las montañas, los ríos, las plantas y cada célula de nuestro cuerpo. Es la raíz del *Sumak Kawsay*,
    el Buen Vivir: estar en armonía con uno mismo, con los demás y con la naturaleza.
  frase: Cuando ese flujo se bloquea, aparecen el estrés y el malestar. Nuestro trabajo es ayudarte a que vuelva a circular.
  texto_final: >-
    El biomagnetismo trabaja a nivel físico y prepara el terreno. La sanación energética trabaja directamente
    sobre ese flujo vital, limpiando bloqueos e interferencias para que tu energía recupere su fuerza.

servicios_titulo: Servicios
servicios_intro: Tres propuestas, de la más puntual a la más profunda. Todas se pueden hacer presencial o a distancia.

servicios:
  - nombre: Biomagnetismo integral
    etiqueta: Punto de partida
    foto: /img/biomagnetismo.webp
    descripcion: >-
      Terapia desarrollada por el Dr. Isaac Goiz Durán en 1988. Se basa en identificar puntos del cuerpo en
      desequilibrio y colocar pares de imanes de polaridad opuesta para ayudar a que el organismo recupere
      su equilibrio natural.
    incluye:
      - "**Rastreo:** testeo kinesiológico para encontrar los puntos en desequilibrio."
      - "**Colocación de pares biomagnéticos** para restablecer el equilibrio del pH y la homeostasis, según el enfoque del biomagnetismo."
      - "**Biomagnetismo emocional:** trabajo sobre cargas emocionales del pasado."
    precio: Consultar
  - nombre: Análisis y armonización energética
    etiqueta: Chequeo completo
    foto: /img/armonizacion.webp
    descripcion: >-
      Una evaluación detallada de todos tus aspectos energéticos, para quienes sienten que su energía bajó
      y quieren entender qué la está afectando, no solo corregirlo.
    incluye:
      - "**Chakras:** análisis y equilibrio de los 7 chakras principales y los menores."
      - "**Aura:** revisión de sus capas magnética, emocional, mental y espiritual, y sellado de fugas."
      - "**Cuerpos energéticos:** alineación del cuerpo físico, emocional, mental y espiritual."
      - "**Pares emocionales** y equilibrio de la glándula pineal."
    precio: Consultar
  - nombre: Sanación energética completa
    etiqueta: La más profunda
    foto: /img/sanacion.webp
    descripcion: >-
      Para quienes sienten bloqueos persistentes en áreas clave de su vida, como el amor, el trabajo, la
      economía o los estudios. Comienza con biomagnetismo emocional y sigue con una limpieza integral de tu
      campo energético.
    incluye:
      - "**Campo áurico:** limpieza, fortalecimiento y sellado de fugas."
      - "**Interferencias externas:** detección y liberación de energías que no te pertenecen."
      - "**Integridad del alma:** recuperación de fragmentos que se hayan perdido."
      - "**Lazos kármicos:** revisión de votos y vínculos que puedan estar limitándote."
      - "**Alineación psicoespiritual** a través de la bioenergética."
    precio: Consultar

pasos_titulo: Cómo es el proceso
pasos:
  - titulo: Consulta
    texto: Me escribís por WhatsApp, me contás cómo estás y elegimos juntos la terapia que más te conviene.
  - titulo: Sesión
    texto: Presencial en la sala o a distancia desde tu casa. Solo necesitás un momento tranquilo para vos.
  - titulo: Devolución
    texto: Al terminar te cuento qué se trabajó y te acompaño con el seguimiento si lo necesitás.

