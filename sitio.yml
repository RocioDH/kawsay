preguntas_titulo: Preguntas frecuentes
preguntas:
  - pregunta: ¿Cómo funciona una sesión a distancia?
    respuesta: Coordinamos día y horario, y en ese momento solo necesitás estar en un lugar tranquilo. La sanación se realiza a través de la bioenergética y la intención, sin necesidad de que estés presente en la sala.
  - pregunta: ¿Cuál terapia me conviene?
    respuesta: Si es tu primera vez, lo más simple es escribirme y contarme qué te pasa. Con eso te recomiendo por dónde empezar.
  - pregunta: ¿Cuánto dura cada sesión?
    respuesta: Depende de la terapia. Te lo confirmo al reservar.
  - pregunta: ¿Reemplaza un tratamiento médico?
    respuesta: No. Son terapias complementarias de bienestar. Si estás en tratamiento, no lo abandones ni cambies tu medicación sin hablar con tu médico.

